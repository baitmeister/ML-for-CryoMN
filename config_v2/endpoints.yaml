screening_gate:
  name: intact_patch_formation_pass
  type: binary
  total_tip_count_default: 100
  min_intact_tip_count_default: 90
  min_intact_tip_fraction: 0.90
  description: >
    Filled and demolded CryoMN patch remains intact, shows no slurry or collapse,
    and meets the minimum visually intact tip count after handling.

preparation_constraints:
  - name: preparation_feasibility_pass
    type: binary
    modeled_after_minimum_labels: 8
    description: >
      Optional manually entered upstream preparation label. Blank values are not
      inferred from patch formation, slurry, collapse, or notes. Modeling starts
      only after the minimum label count includes both pass and fail classes.
  - name: homogeneous_solution_pass
    type: binary
    description: Optional manual indication that the formulation was homogeneous.
  - name: fillability_pass
    type: binary
    description: Optional manual indication that the formulation could fill the mold.
  - name: apparent_viscosity_mPa_s_25C_10s
    type: continuous
    unit: mPa_s
    maximum_for_provisional_pass: 3000
    description: Apparent viscosity measured at 25 C and 10 inverse seconds.
  - name: homogeneous_after_preparation_pass
    type: binary
    description: Clear and homogeneous immediately after preparation.
  - name: homogeneous_after_4C_30min_pass
    type: binary
    description: Clear and homogeneous after 30 minutes at 4 C.
  - name: no_sediment_or_crystallization_2h_pass
    type: binary
    description: No sediment or crystallization after two hours.
  - name: filled_cavity_count
    type: count
    minimum_for_provisional_pass: 90
    reference_total_cavities: 100
    description: Cavities filled after centrifugation at 400 g for three minutes.
  - name: total_cavity_count
    type: count
    expected_value: 100
    description: Total mold cavities assessed for fillability.

primary_objectives:
  - name: viability_percent
    direction: maximize
    unit: percent
    legacy_transfer: true
  - name: critical_axial_load_N_per_needle
    direction: maximize
    unit: N_per_needle
    legacy_transfer: false

secondary_endpoints:
  - name: initial_stiffness_N_per_mm_per_needle
    role: diagnostic_covariate_tiebreaker
    unit: N_per_mm_per_needle

final_qualitative_checks:
  - name: thumb_insertion_pass
    type: binary
    modeled: false
    description: >
      Final yes/no qualitative check only. Thumb force is not quantified and is
      not used as a modeled force endpoint.
