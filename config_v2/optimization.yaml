random_seed: 42

surrogate_model:
  policy_version: round3_surrogate_uncertainty_v2
  start_round: 3
  regression_kernel: matern_2p5_explicit_observation_noise

formulation_similarity:
  enabled: true
  start_round: 3
  metric: registry_bounds_euclidean
  distance_threshold: 0.05
  single_ingredient_min_relative_difference: 0.50
  compare_within_generated_pool: true
  history_source_types:
    - legacy_wetlab
    - wetlab_feedback

formulation_feasibility:
  # Version schedule is forward-only: the v1 checks remain authoritative for
  # Rounds 2-4 and the literature-backed v2 checks begin in Round 5.
  policy_versions:
    - policy_version: round2_candidate_feasibility_v1
      start_round: 2
    - policy_version: round5_solubility_viscosity_v2
      start_round: 5
  # Legacy scalar keys remain for older consumers and describe the first policy.
  policy_version: round2_candidate_feasibility_v1
  start_round: 2
  max_active_polymers: 1
  max_total_polymer_pct: 10.0
  max_total_serum_protein_pct: 10.0
  max_total_polymer_serum_pct: 15.0
  max_sugar_M_with_polymer: 0.50
  max_nonpermeating_M_with_polymer: 0.75
  ingredient_caps:
    pvp_pct: 10.0
    dextran_pct: 5.0
    hyaluronic_acid_pct: 1.0
  polymer_features:
    - pvp_pct
    - dextran_pct
    - hyaluronic_acid_pct
    - methylcellulose_pct
  serum_protein_features:
    - fbs_pct
    - hsa_pct
    - human_serum_pct
    # Keep feasibility chemistry independent of temporary lab availability.
    # Sericin is currently unavailable, but must contribute to the protein /
    # crowding burden as soon as availability is restored.
    - sericin_pct
  sugar_features:
    - trehalose_M
    - sucrose_M
    - glucose_M
    - raffinose_M
  nonpermeating_osmolyte_features:
    - ectoin_M
    - trehalose_M
    - sucrose_M
    - raffinose_M
    - taurine_M
    - myo_inositol_M
    - methoxyphenyl_beta_d_glucopyranoside_M
    - betaine_M
    - proline_M
    - glucose_M
    - creatine_M
    - acetamide_M
  round5_rules:
    max_total_permeating_cpa_M: 2.50
    max_total_nonpermeating_solute_M: 0.50
    max_total_sugar_M: 0.50
    max_sugar_M_with_polymer: 0.30
    max_nonpermeating_M_with_polymer: 0.30
    max_crystalline_solute_saturation_burden: 0.80
    max_active_polymers: 1
    max_total_polymer_pct: 10.0
    max_total_serum_protein_pct: 10.0
    max_total_polymer_serum_pct: 15.0
    # Retained only as an audit diagnostic; there is intentionally no hard
    # total-g/L rejection threshold in v2.
    report_estimated_small_solute_g_L: true
candidate_generation:
  local_fraction: 0.40
  sparse_fraction: 0.35
  boundary_fraction: 0.25
  local_relative_std: 0.20
  local_max_active_ingredients: 6
  sparse_max_active_ingredients: 2
  boundary_max_active_ingredients: 4
  max_attempt_multiplier: 100
  rescue_min_viability_percent: 50.0
  rescue_scale_factors:
    - 0.25
    - 0.50
    - 0.75
  rescue_candidates_per_round: 2

support_policy:
  radius_percentile: 95.0
  radius_multiplier: 1.25
  uncertainty_cap_percentile: 90.0
  max_boundary_candidates_per_slate: 1
  out_of_support_score_penalty: 0.20
  competitive_utility_band: 0.15
  diversity_weight: 0.05

preparation_model:
  min_labels: 8
  probability_threshold: 0.50

continuous_qlognehvi:
  enabled: true
  generated_candidate_target: 24
  max_sparse_mask_size: 4
  max_masks: 16

phase_mode: auto

phase_transition:
  mechanics_enable_min_paired_observations: 8
  mechanics_enable_min_distinct_formulations: 6
  mechanics_enable_min_batches: 2

round_policy:
  viability_screens_per_round: 12
  mechanical_tests_per_round: 4
  mechanical_min_tests_per_round: 3
  allow_one_novelty_exception: true
  # Used only by intact_combination_policy.compatibility_mode. The active
  # empirical-feasibility mechanics mode ranks all 12 rows and uses actual
  # intact results to promote ordered backups.
  intact_probability_threshold: 0.50
  mechanics_startup_observation_threshold: 8

penalties:
  active_ingredient_soft_limit: 8
  active_ingredient_excess_weight: 0.05
  single_molar_ingredient_limit_M: 0.5
  single_molar_excess_weight: 0.20
  # Retained for the documented classifier-compatibility mechanics mode.
  # The active Round-6 empirical policy does not use this term.
  intact_failure_weight: 0.80

intact_combination_policy:
  policy_version: round6_empirical_combination_intact_v1
  start_round: 6
  evidence_source_types:
    - wetlab_feedback
  evidence_radius: 0.35
  beta_prior_pass: 1.0
  beta_prior_fail: 1.0
  screening_neutral_probability: 0.50
  screening_max_penalty: 0.20
  mechanics_mode: empirical_feasibility_weighted
  compatibility_mode: classifier_threshold_penalty
  numerical_probability_floor: 1.0e-9
  mechanics_primary_test_count: 4
  mechanics_backup_behavior: actual_intact_priority_promotion

cold_start_policy:
  policy_version: round6_cold_start_graduation_v1
  start_round: 6
  evidence_source_types:
    - wetlab_feedback
  evidence_endpoint: viability_percent
  minimum_distinct_formulations: 3
  max_ordinary_rows_per_ingredient: 2
  graduation_slots_per_round: 4
  exempt_candidate_origins:
    - retest
    - rescue_dilution
  graduation_max_cold_ingredients_per_row: 1
  graduation_require_distinct_active_sets: true
  same_origin_replacement_preferred: true
  preserve_origin_allocation: true

transfer:
  literature_viability_noise_percent: 50.0
  legacy_wetlab_viability_noise_percent: 5.0
  legacy_mechanical_transfer: false

feedback:
  new_viability_noise_percent: 1.0

prediction_labeling:
  # Raw surrogate values remain available for acquisition and frozen
  # prospective evaluation. Public prediction fields are blanked when the
  # formulation is an unobserved cold start, outside support, or has reverted
  # to the surrogate's pooled training prior.
  policy_version: round7_viability_prediction_labeling_v1
  start_round: 7
  enabled: true
  prior_reversion_mean_tolerance_percent: 2.50
  prior_reversion_std_ratio_threshold: 0.95

selection:
  generated_candidate_pool_size: 2000
  viability_ucb_kappa: 0.35
  mechanical_ucb_kappa: 0.50
  diversity_weight: 0.10
  novelty_exception_probability_floor: 0.25
  # Max number of selected candidates in a round that may share the exact
  # same *pair* (2-ingredient) active-ingredient set. Prevents the slate
  # from being dominated by repeats of one high-viability-scoring pair
  # (e.g. ectoin + ethylene_glycol) once origin-bucket diversity alone isn't
  # enough, since every origin bucket can independently re-discover the
  # same favored pair. See _enforce_ingredient_combination_cap.
  max_candidates_per_ingredient_combination: 2
  # Max number of selected candidates in a round that may share the exact
  # same *3-or-more-ingredient* active-ingredient set (trio, four-a-kind,
  # etc.). An exact match across 3+ ingredients simultaneously is a much
  # stronger redundancy signal than a repeated pair, so this is much
  # tighter by default: at most 1 candidate per round per exact larger
  # combination.
  max_candidates_per_larger_ingredient_combination: 1
  max_candidates_per_shared_ingredient_pair: 5
  # Round 3+ marginal-frequency invariant: each registry ingredient may
  # appear above its practical presence threshold in at most five of the
  # twelve selected rows. Retests and rescues count but are protected from
  # removal; ordinary replacements preserve candidate origin.
  max_candidates_per_ingredient: 5
  ingredient_frequency_policy_version: round3_marginal_ingredient_diversity_v1
  ingredient_frequency_start_round: 3
  reference_point:
    viability_percent: 0.0
    critical_axial_load_N_per_needle: 0.0

# NOTE: viability_weight/intact_weight below are unused by the active
# screening path and retained only as a record of the pre-Round-6 scheme.
# Screening now uses normalized viability UCB minus chemistry, support, and
# empirical exact-combination intact deductions. The additive intact
# classifier remains diagnostic except in compatibility mechanics mode.
screening_phase:
  viability_weight: 0.75
  intact_weight: 0.25

retest:
  enabled: true
  policy_version: campaign_observed_instability_v2
  max_candidates_per_round: 2
  formulation_disagreement_threshold_percent: 15.0
  local_residual_threshold_percent: 20.0
  within_batch_std_threshold_percent: 8.0
  within_batch_min_replicates: 3
  one_time_anomaly_confirmation: true
  nearest_neighbor_count: 3
